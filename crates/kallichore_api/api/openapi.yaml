openapi: 3.0.1
info:
  contact:
    email: info@posit.co
    name: "Posit Software, PBC"
    url: https://posit.co
  description: Kallichore is a Jupyter kernel gateway and supervisor
  title: Kallichore API
  version: 1.0.0
servers:
- url: /
paths:
  /sessions:
    get:
      operationId: list-sessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sessionList"
          description: List of active sessions
      summary: List active sessions
    put:
      operationId: new-session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/newSession"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/new_session_200_response"
          description: The session ID
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Invalid request
        "401":
          content: {}
          description: Unauthorized
      security: []
      summary: Create a new session
  /sessions/{session_id}:
    delete:
      operationId: delete-session
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Session deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Failed to delete session
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Session not found
      security: []
      summary: Delete session
    get:
      operationId: get-session
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/activeSession"
          description: Session details
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Failed to get session
        "404":
          content:
            application/json: {}
          description: Session not found
      summary: Get session details
  /sessions/{session_id}/start:
    post:
      operationId: start-session
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Started
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/startupError"
          description: Start failed
        "404":
          content:
            application/json: {}
          description: Session not found
        "401":
          content: {}
          description: Unauthorized
      security: []
      summary: Start a session
  /sessions/{session_id}/restart:
    post:
      operationId: restart-session
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/restartSession"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Restarted
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/startupError"
          description: Restart failed
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Session not found
      security: []
      summary: Restart a session
  /sessions/{session_id}/kill:
    post:
      operationId: kill-session
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Killed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Kill failed
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Session not found
      security: []
      summary: Force quit session
  /sessions/{session_id}/adopt:
    put:
      operationId: adopt-session
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/connectionInfo"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Adopted
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Adoption failed
        "404":
          content:
            application/json: {}
          description: Session not found
        "401":
          content: {}
          description: Unauthorized
      security: []
      summary: Adopt an existing session
  /sessions/{session_id}/connection_info:
    get:
      operationId: connection-info
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connectionInfo"
          description: Connection Info
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Failed
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Session not found
      security: []
      summary: Get Jupyter connection information for the session
  /sessions/{session_id}/interrupt:
    post:
      operationId: interrupt-session
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Interrupted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Interrupt failed
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Session not found
      security: []
      summary: Interrupt session
  /sessions/{session_id}/channels:
    get:
      operationId: channels-upgrade
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                description: The path to the domain socket or the WebSocket URL for
                  the session
                type: string
          description: Upgraded connection
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Invalid request
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Session not found
      security: []
      summary: Upgrade to a WebSocket or domain socket for channel communication
  /sessions/{session_id}/execute:
    post:
      operationId: execute-code
      parameters:
      - explode: false
        in: path
        name: session_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/executeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/executeReply"
          description: Execution completed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Invalid request
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Session not found
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Execution timed out
      security: []
      summary: Execute code and return results
  /shutdown:
    post:
      operationId: shutdown-server
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Shutting down
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Shutdown failed
        "401":
          content: {}
          description: Unauthorized
      security: []
      summary: Shut down all sessions and the server itself
  /status:
    get:
      operationId: server-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/serverStatus"
          description: Server status and information
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Error
      summary: Get server status and information
  /client_heartbeat:
    post:
      operationId: client-heartbeat
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/clientHeartbeat"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Heartbeat received
      summary: Notify the server that a client is connected
  /server_configuration:
    get:
      operationId: get-server-configuration
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/serverConfiguration"
          description: The current server configuration
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Failed to get configuration
      summary: Get the server configuration
    post:
      operationId: set-server-configuration
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/serverConfiguration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Configuration updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Error
      summary: Change the server configuration
  /mcp/workspaces:
    post:
      description: "Registers (or re-registers) a workspace and starts the MCP listener\
        \ if it isn't already running. Re-registering with a known workspace ID returns\
        \ the same bearer token, so agents launched from terminals that outlived the\
        \ window keep working. The server keeps no state across restarts, so a caller\
        \ that wants the token to outlive the server supplies the one it was issued\
        \ before."
      operationId: register-mcp-workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mcpWorkspaceRegistration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mcpWorkspace"
          description: Workspace registered
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Invalid request
        "401":
          content: {}
          description: Unauthorized
      security: []
      summary: Register a Positron workspace with the MCP server
  /mcp/workspaces/{workspace_id}:
    delete:
      description: Removes the workspace and invalidates its token. When the last
        workspace is removed the MCP listener stops and its port is released.
      operationId: deregister-mcp-workspace
      parameters:
      - explode: false
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json: {}
          description: Workspace deregistered
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Workspace not found
      security: []
      summary: Deregister a Positron workspace
  /mcp/workspaces/{workspace_id}/channel:
    get:
      description: "Opens the bidirectional channel over which a window pushes its\
        \ workspace's command catalog and foreground session, and over which the supervisor\
        \ brokers agent command requests."
      operationId: mcp-workspace-channel
      parameters:
      - explode: false
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json: {}
          description: Upgraded connection
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Invalid request
        "401":
          content: {}
          description: Unauthorized
        "404":
          content:
            application/json: {}
          description: Workspace not found
      security: []
      summary: Upgrade to a WebSocket carrying the MCP frontend channel
components:
  responses:
    UnauthorizedError:
      content: {}
      description: Unauthorized
  schemas:
    error:
      example:
        code: code
        details: details
        message: message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
      type: object
    envVarActions:
      description: A list of environment variable actions to perform
      items:
        $ref: "#/components/schemas/varAction"
      type: array
    sessionMode:
      description: The mode in which the session is running
      enum:
      - console
      - notebook
      - background
      type: string
    varActionType:
      description: The type of action to perform on the environment variable
      enum:
      - replace
      - append
      - prepend
      type: string
    varAction:
      properties:
        action:
          $ref: "#/components/schemas/varActionType"
        name:
          description: The name of the variable to act on
          type: string
        value:
          description: "The value to replace, append, or prepend"
          type: string
      required:
      - action
      - name
      - value
      type: object
    connectionInfo:
      description: Connection information for an existing session
      example:
        stdin_port: 1
        control_port: 0
        hb_port: 5
        ip: ip
        iopub_port: 5
        transport: transport
        signature_scheme: signature_scheme
        shell_port: 6
        key: key
      properties:
        control_port:
          description: The port for control messages
          type: integer
        shell_port:
          description: The port for shell messages
          type: integer
        stdin_port:
          description: The port for stdin messages
          type: integer
        hb_port:
          description: The port for heartbeat messages
          type: integer
        iopub_port:
          description: The port for IOPub messages
          type: integer
        signature_scheme:
          description: The signature scheme for messages
          type: string
        key:
          description: The key for messages
          type: string
        transport:
          description: The transport protocol
          type: string
        ip:
          description: The IP address for the connection
          type: string
      required:
      - control_port
      - hb_port
      - iopub_port
      - ip
      - key
      - shell_port
      - signature_scheme
      - stdin_port
      - transport
      type: object
    startupError:
      example:
        output: output
        exit_code: 0
        error:
          code: code
          details: details
          message: message
      properties:
        exit_code:
          description: "The exit code of the process, if it exited"
          type: integer
        output:
          description: "The output of the process (combined stdout and stderr) emitted\
            \ during startup, if any"
          type: string
        error:
          $ref: "#/components/schemas/error"
      required:
      - error
      type: object
    startupEnvironment:
      description: "The kernel's startup environment: 'none' for normal startup, 'shell'\
        \ for a login shell, 'command' for a preflight command, 'script' to run a\
        \ script. Only relevant on POSIX-like systems."
      enum:
      - none
      - shell
      - command
      - script
      type: string
    status:
      description: The status of the session
      enum:
      - uninitialized
      - starting
      - ready
      - idle
      - busy
      - offline
      - exited
      type: string
    interrupt_mode:
      description: The mechansim for interrupting the session
      enum:
      - signal
      - message
      type: string
    clientHeartbeat:
      properties:
        process_id:
          description: The process ID of the client sending the heartbeat
          type: integer
      type: object
    newSession:
      properties:
        session_id:
          description: A unique identifier for the session
          type: string
        display_name:
          description: A human-readable name for the session
          type: string
        language:
          description: The interpreter language
          type: string
        username:
          description: The username of the user who owns the session
          type: string
        input_prompt:
          description: The text to use to prompt for input
          type: string
        continuation_prompt:
          description: The text to use to prompt for input continuations
          type: string
        argv:
          description: The program and command-line parameters for the session
          items:
            type: string
          type: array
        session_mode:
          $ref: "#/components/schemas/sessionMode"
        working_directory:
          description: The working directory in which to start the session.
          type: string
        notebook_uri:
          description: "For notebook sessions, the URI of the notebook file"
          type: string
        env:
          description: A list of environment variable actions to perform
          items:
            $ref: "#/components/schemas/varAction"
          type: array
        connection_timeout:
          default: 30
          description: The number of seconds to wait for a connection to the session's
            ZeroMQ sockets before timing out
          type: integer
        interrupt_mode:
          $ref: "#/components/schemas/interrupt_mode"
        protocol_version:
          default: "5.3"
          description: The Jupyter protocol version supported by the underlying kernel
          type: string
        startup_environment:
          $ref: "#/components/schemas/startupEnvironment"
        startup_environment_arg:
          description: The command or script to run before starting the session
          type: string
        workspace_id:
          description: "The MCP workspace creating the session, if the client has\
            \ registered one. The session belongs to that workspace: agents reach\
            \ it through that workspace's MCP endpoint and no other."
          type: string
      required:
      - argv
      - continuation_prompt
      - display_name
      - env
      - input_prompt
      - interrupt_mode
      - language
      - session_id
      - session_mode
      - startup_environment
      - username
      - working_directory
      type: object
    restartSession:
      properties:
        working_directory:
          description: "The desired working directory for the session after restart,\
            \ if different from the session's working directory at startup"
          type: string
        env:
          description: A list of environment variable actions to perform
          items:
            $ref: "#/components/schemas/varAction"
          type: array
      type: object
    execution_queue:
      description: The execution queue for a session
      example:
        pending:
        - "{}"
        - "{}"
        length: 1
        active: "{}"
      properties:
        active:
          description: "The execution request currently being evaluated, if any"
          type: object
        length:
          description: The number of items in the pending queue
          type: integer
        pending:
          description: The queue of pending execution requests
          items:
            type: object
          type: array
      required:
      - length
      - pending
      type: object
    executeRequest:
      description: A request to execute code in a session
      properties:
        code:
          description: The code to execute
          type: string
        silent:
          default: false
          description: "If true, signals the kernel to execute quietly: no broadcast\
            \ on iopub, no execute_result, and the execution_count is not incremented.\
            \ Defaults to false."
          type: boolean
        store_history:
          default: true
          description: "If true (default), the code is stored in the kernel's history.\
            \ Set to false for throwaway executions."
          type: boolean
        stop_on_error:
          default: true
          description: "If true (default), abort the execution queue on error. If\
            \ false, queued execute requests will still be processed even if this\
            \ one fails."
          type: boolean
        timeout_seconds:
          description: "Maximum number of seconds to wait for execution to complete.\
            \ If not specified, the request will block indefinitely until execution\
            \ finishes."
          type: integer
      required:
      - code
      type: object
    executeReply:
      description: The result of executing code in a session
      example:
        output:
        - error_message: error_message
          error_name: error_name
          metadata: "{}"
          stream_name: stream_name
          data:
            key: data
          text: text
          error_traceback:
          - error_traceback
          - error_traceback
          type: stream
        - error_message: error_message
          error_name: error_name
          metadata: "{}"
          stream_name: stream_name
          data:
            key: data
          text: text
          error_traceback:
          - error_traceback
          - error_traceback
          type: stream
        error_message: error_message
        error_name: error_name
        data:
          key: data
        execution_count: 0
        error_traceback:
        - error_traceback
        - error_traceback
        status: ok
      properties:
        status:
          $ref: "#/components/schemas/executeReply_status"
        execution_count:
          description: The kernel's execution counter
          type: integer
        output:
          description: "All output messages produced during execution, in order"
          items:
            $ref: "#/components/schemas/executeOutput"
          type: array
        data:
          additionalProperties:
            type: string
          description: "The execution result as a MIME-keyed dictionary (from execute_result),\
            \ if the execution produced a result"
          type: object
        error_name:
          description: "The error name, if the execution failed"
          type: string
        error_message:
          description: "The error message, if the execution failed"
          type: string
        error_traceback:
          description: "The error traceback, if the execution failed"
          items:
            type: string
          type: array
      required:
      - execution_count
      - output
      - status
      type: object
    executeOutput:
      description: A single output message produced during code execution
      example:
        error_message: error_message
        error_name: error_name
        metadata: "{}"
        stream_name: stream_name
        data:
          key: data
        text: text
        error_traceback:
        - error_traceback
        - error_traceback
        type: stream
      properties:
        type:
          $ref: "#/components/schemas/executeOutput_type"
        stream_name:
          description: "The stream name (stdout or stderr), for stream output"
          type: string
        text:
          description: "The text content, for stream output"
          type: string
        data:
          additionalProperties:
            type: string
          description: "MIME-keyed data, for display_data output"
          type: object
        metadata:
          description: "Metadata dictionary, for display_data output"
          type: object
        error_name:
          description: "The error name, for error output"
          type: string
        error_message:
          description: "The error message, for error output"
          type: string
        error_traceback:
          description: "The error traceback lines, for error output"
          items:
            type: string
          type: array
      required:
      - type
      type: object
    activeSession:
      example:
        process_id: 6
        input_prompt: input_prompt
        continuation_prompt: continuation_prompt
        busy_seconds: 2
        kernel_info: "{}"
        session_id: session_id
        language: language
        started: 2000-01-23T04:56:07.000+00:00
        working_directory: working_directory
        display_name: display_name
        argv:
        - argv
        - argv
        socket_path: socket_path
        notebook_uri: notebook_uri
        execution_queue:
          pending:
          - "{}"
          - "{}"
          length: 1
          active: "{}"
        interrupt_mode: signal
        connected: true
        resource_usage:
          sampling_period_ms: 7
          thread_count: 2
          memory_bytes: 5
          cpu_percent: 5
          timestamp: 9
        session_mode: console
        initial_env:
          key: initial_env
        username: username
        status: uninitialized
        idle_seconds: 3
      properties:
        session_id:
          description: A unique identifier for the session
          type: string
        argv:
          description: The program and command-line parameters for the session
          items:
            type: string
          type: array
        process_id:
          description: "The underlying process ID of the session, if the session is\
            \ running."
          type: integer
        username:
          description: The username of the user who owns the session
          type: string
        display_name:
          description: A human-readable name for the session
          type: string
        language:
          description: The interpreter language
          type: string
        interrupt_mode:
          $ref: "#/components/schemas/interrupt_mode"
        initial_env:
          additionalProperties:
            type: string
          description: The environment variables set when the session was started
          type: object
        connected:
          description: Whether the session is connected to a client
          type: boolean
        started:
          description: An ISO 8601 timestamp of when the session was started
          format: date-time
          type: string
